<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087e91"><title>Badria Kafood Architecture | Qatar Projects</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7f9;color:#17232d}header{background:#fff;padding:12px 16px;border-bottom:1px solid #e1e8ed;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;align-items:center;gap:12px}.mark{width:54px;height:54px;border:3px solid #51bfd0;border-radius:50%;display:grid;place-items:center;color:#087e91;font-weight:800;font-size:13px}.brand h1{margin:0;font-size:20px;color:#102536}.brand p{margin:3px 0 0;font-size:11px;color:#71808c}.stats{display:flex;gap:7px}.stat{padding:7px 12px;background:#f6fafb;border:1px solid #e1e8ed;border-radius:10px;text-align:center}.stat b{display:block;color:#087e91;font-size:18px}.stat span{font-size:9px;color:#71808c}.bar{background:#fff;padding:8px;display:flex;gap:7px;border-bottom:1px solid #e1e8ed;position:sticky;top:0;z-index:1001}.bar>*{padding:9px;border:1px solid #d6e0e6;border-radius:8px;background:#fff}input{flex:1;min-width:160px}.layout{display:grid;grid-template-columns:1fr 370px;height:calc(100vh - 130px)}#map{min-height:0}.panel{background:#fff;overflow:auto;padding:10px;border-left:1px solid #e1e8ed}.project{border:1px solid #e1e8ed;border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer}.top{display:flex;justify-content:space-between;gap:6px}.name{font-weight:700;font-size:13px}.badge{font-size:9px;padding:4px 6px;border-radius:20px;background:#e7f7fa;color:#087e91}.fin{background:#f4efe5;color:#8b621e}.meta{font-size:11px;color:#71808c;line-height:1.5;margin-top:5px}.open{display:block;margin-top:7px;color:#087e91;font-size:11px;font-weight:bold;text-decoration:none}@media(max-width:800px){body{overflow:auto}header{padding:9px 10px}.brand h1{font-size:15px}.brand p{font-size:9px}.mark{width:45px;height:45px;font-size:10px}.stats{display:none}.bar{display:grid;grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1;width:100%}.layout{display:flex;flex-direction:column;height:auto}#map{height:52vh;min-height:380px}.panel{border:0;border-top:1px solid #e1e8ed}.panel h2{font-size:14px}}</style></head><body><header><div class="brand"><div class="mark">BK<br>ARCH</div><div><h1>Badria Kafood Architecture</h1><p>Project Location Dashboard • Qatar</p></div></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total</span></div><div class="stat"><b id="con">0</b><span>Construction</span></div><div class="stat"><b id="fin">0</b><span>Finishing</span></div><div class="stat"><b id="areas">0</b><span>Areas</span></div></div></header><div class="bar"><input id="search" placeholder="Search project, client, contractor, engineer or area…"><select id="area"><option value="">All areas</option></select><select id="type"><option value="">All types</option><option>Construction</option><option>Finishing</option></select><button id="all">All</button><button id="fit">Qatar</button></div><div class="layout"><div id="map"></div><aside class="panel"><h2>Project Directory <small id="shown"></small></h2><div id="list"></div></aside></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const P=[{"id":1,"type":"Construction","client":"مشروع 1","area":"الثمامة","contractor":"","supervisor":"","mep":"","map":""},{"id":2,"type":"Construction","client":"مشروع 2","area":"روضة الحمامة","contractor":"","supervisor":"","mep":"","map":""},{"id":3,"type":"Construction","client":"مشروع 3","area":"الريان","contractor":"","supervisor":"","mep":"","map":""}];/* Project records are maintained in the accompanying company workbook. */const areas=[...new Set(P.map(x=>x.area))].sort();const map=L.map('map').setView([25.285,51.53],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map);const a=document.getElementById('area');areas.forEach(x=>a.innerHTML+=`<option>${x}</option>`);function render(){layer.clearLayers();const q=search.value.toLowerCase(),t=type.value,ar=a.value,ps=P.filter(p=>(!q||Object.values(p).join(' ').toLowerCase().includes(q))&&(!t||p.type==t)&&(!ar||p.area==ar));list.innerHTML='';shown.textContent='('+ps.length+')';ps.forEach((p,i)=>{let m=L.marker([25.285+i*.002,51.53+i*.002]).bindPopup(`<b>${p.client}</b><br>${p.type}<br>${p.area}${p.map?`<br><a href="${p.map}" target="_blank">Open exact Google Maps location →</a>`:''}`);layer.addLayer(m);let d=document.createElement('div');d.className='project';d.innerHTML=`<div class="top"><div class="name">${p.client}</div><span class="badge ${p.type=='Finishing'?'fin':''}">${p.type}</span></div><div class="meta">Area: ${p.area}<br>Contractor: ${p.contractor||'-'}<br>Supervisor: ${p.supervisor||'-'}</div>${p.map?`<a class="open" href="${p.map}" target="_blank">Exact Google Maps location →</a>`:''}`;d.onclick=()=>{map.setView(m.getLatLng(),13);m.openPopup()};list.appendChild(d)});total.textContent=P.length;con.textContent=P.filter(p=>p.type=='Construction').length;fin.textContent=P.filter(p=>p.type=='Finishing').length;areas.textContent=areas.length}document.querySelectorAll('input,select').forEach(x=>x.oninput=render);all.onclick=()=>{search.value='';a.value='';type.value='';render()};fit.onclick=()=>map.setView([25.285,51.53],10);render();</script></body></html>
