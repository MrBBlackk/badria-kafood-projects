<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#087e91"><title>Badria Kafood Architecture | Qatar Projects</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Segoe UI,sans-serif;background:#f4f7f9;color:#17232d}
header{background:#fff;padding:10px 16px;border-bottom:1px solid #dfe7ec;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:62px;height:62px;object-fit:contain;border-radius:50%}
h1{margin:0;font-size:20px;color:#102536}.sub{margin-top:4px;font-size:11px;color:#71808c}
.stats{display:flex;gap:7px}.stat{min-width:85px;padding:7px 10px;text-align:center;background:#f5fafb;border:1px solid #dfe7ec;border-radius:10px}
.stat b{display:block;font-size:18px;color:#087e91}.stat span{font-size:9px;color:#71808c}
.toolbar{background:#fff;padding:8px;display:flex;gap:7px;border-bottom:1px solid #dfe7ec;position:sticky;top:0;z-index:1001}
input,select,button{font:inherit;border:1px solid #d3dfe5;border-radius:8px;padding:9px 10px;background:#fff;color:#243542}
input{flex:1;min-width:170px}button{font-size:12px;font-weight:bold;cursor:pointer}button.active{background:#087e91;color:#fff}
.layout{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 132px)}#map{min-height:0}
.panel{background:#fff;border-left:1px solid #dfe7ec;overflow:auto;padding:11px}.panel h2{font-size:14px;margin:2px 0 9px}
.project{border:1px solid #dfe7ec;border-radius:11px;padding:11px;margin-bottom:8px;cursor:pointer}.project:hover{border-color:#7bbdca}
.top{display:flex;justify-content:space-between;gap:7px}.name{font-weight:700;font-size:13px}.badge{font-size:9px;padding:4px 7px;border-radius:20px;background:#e7f7fa;color:#087e91;white-space:nowrap;height:max-content}.badge.fin{background:#f5efe4;color:#8b621e}
.meta{font-size:11px;color:#71808c;line-height:1.55;margin-top:5px}.open{display:block;margin-top:7px;color:#087e91;font-size:11px;font-weight:bold;text-decoration:none}
@media(max-width:800px){header{padding:8px 10px}.logo{width:48px;height:48px}h1{font-size:15px}.sub{font-size:9px}.stats{display:none}.toolbar{display:grid;grid-template-columns:1fr 1fr}input{grid-column:1/-1;min-width:0}.toolbar>*{width:100%}.layout{display:flex;flex-direction:column;height:auto}#map{height:52vh;min-height:380px}.panel{border:0;border-top:1px solid #dfe7ec;height:auto}}
</style></head>
