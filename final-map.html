<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badria Kafood Architecture | Projects</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#17232d}.top{background:#102536;color:#fff;padding:15px 20px;display:flex;justify-content:space-between}.brand{font-size:20px;font-weight:800}.sub{font-size:11px;opacity:.7;margin-top:4px}.legend{font-size:12px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.blue{background:#1677d2}.orange{background:#f28c28}.bar{background:#fff;padding:10px;display:flex;gap:8px}.bar input,.bar select{padding:9px;border:1px solid #ccd8df;border-radius:8px}.bar input{flex:1}.layout{display:grid;grid-template-columns:1fr 370px;height:calc(100vh - 106px)}#map{height:100%}.side{background:#fff;border-left:1px solid #dfe7ec;overflow:auto;padding:10px}.item{border:1px solid #e0e7eb;border-radius:9px;padding:9px;margin-bottom:7px;cursor:pointer}.name{font-weight:700;font-size:13px}.badge{float:right;color:#fff;border-radius:12px;padding:3px 7px;font-size:9px}.meta{font-size:10px;color:#71808c;line-height:1.5;margin-top:4px}.pin{width:25px;height:25px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 7px #0005}.pin i{display:block;width:7px;height:7px;background:#fff;border-radius:50%;margin:6px}@media(max-width:800px){.legend{display:none}.layout{display:flex;flex-direction:column;height:auto}#map{height:55vh;min-height:390px}.side{border:0;border-top:1px solid #dfe7ec}}</style></head><body><header class="top"><div><div class="brand">BADRIA KAFOOD ARCHITECTURE</div><div class="sub">Qatar Active Projects — Location Dashboard</div></div><div class="legend"><span><i class="dot blue"></i>Construction</span><span><i class="dot orange"></i>Finishing</span></div></header><div class="bar"><input id="q" placeholder="Search client, contractor, supervisor, MEP or area"><select id="t"><option value="">All project types</option><option>Construction</option><option>Finishing</option></select></div><main class="layout"><div id="map"></div><aside class="side"><div id="list"></div></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(async()=>{const exact={"https://maps.app.goo.gl/WpDwP8ZBzWh8eUKd8":[25.441819,51.517491],"https://maps.app.goo.gl/BtndLTyvJUXmToUG8":[25.4470539,51.504791],"https://maps.app.goo.gl/4VNAxv5K9pR4DFw38":[25.4457033,51.503054],"https://maps.app.goo.gl/u7zQXZc4DTPhAgn37":[25.4474453,51.4993173],"https://maps.app.goo.gl/iDojbxr14yaYa96PA":[25.4471801,51.5020914]};const r=await fetch('https://api.github.com/repos/MrBBlackk/badria-kafood-projects/git/blobs/791c117a34fa0f019ee8c19b85e86d220411b59d').then(x=>x.json());const bin=atob(r.content.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const txt=new TextDecoder().decode(bytes);const m=txt.match(/const P=(.*?); const map=/s);if(!m)throw Error('Project data unavailable');const P=JSON.parse(m[1]);P.forEach(p=>{if(exact[p.map]){p.lat=exact[p.map][0];p.lon=exact[p.map][1]}});const map=L.map('map').setView([25.285,51.53],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map),esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function icon(p){return L.divIcon({className:'',html:'<div class="pin '+(p.type==='Construction'?'blue':'orange')+'"><i></i></div>',iconSize:[25,25],iconAnchor:[12,24]})}function render(){layer.clearLayers();list.innerHTML='';const s=q.value.toLowerCase().trim(),ty=t.value,ps=P.filter(p=>(!ty||p.type===ty)&&(!s||[p.client,p.contractor,p.supervisor,p.area,p.mep].join(' ').toLowerCase().includes(s)));ps.forEach(p=>{const has=Number.isFinite(p.lat)&&Number.isFinite(p.lon);let mk;if(has)mk=L.marker([p.lat,p.lon],{icon:icon(p)}).bindPopup('<b>'+esc(p.client)+'</b><br>'+esc(p.type)+'<br>'+esc(p.area)+'<br><b>Contractor:</b> '+esc(p.contractor)+'<br><b>Supervisor:</b> '+esc(p.supervisor)+(p.map?'<br><a href="'+esc(p.map)+'" target="_blank">Open Google Maps →</a>':'')).addTo(layer);const d=document.createElement('div');d.className='item';d.innerHTML='<span class="badge '+(p.type==='Construction'?'blue':'orange')+'">'+p.type+'</span><div class="name">#'+p.id+' — '+esc(p.client)+'</div><div class="meta">'+esc(p.area)+' · '+esc(p.contractor)+'<br>'+esc(p.supervisor)+' · '+esc(p.mep)+'</div>';d.onclick=()=>has?(map.setView([p.lat,p.lon],16),mk.openPopup()):p.map?window.open(p.map,'_blank'):null;list.appendChild(d)})}q.oninput=t.onchange=render;render()})().catch(e=>document.body.innerHTML='<h2 style="padding:30px">Unable to load project data.</h2>');</script></body></html>
