f=p.map||'#';zoom.disabled=!Number.isFinite(p.lat);zoom.onclick=()=>Number.isFinite(p.lat)&&map.setView([p.lat,p.lon],16)}function render(){layer.clearLayers();list.innerHTML='';const q=search.value.toLowerCase().trim(),t=type.value,a=area.value,ps=P.filter(p=>(!q||JSON.stringify(p).toLowerCase().includes(q))&&(!t||p.type===t)&&(!a||p.area===a));dirCount.textContent=ps.length;ps.forEach(p=>{if(Number.isFinite(p.lat)&&Number.isFinite(p.lon)){const mk=L.marker([p.lat,p.lon],{icon:pin(p)}).addTo(layer);mk.on('click',()=>detail(p))}const el=document.createElement('div');el.className='item';el.innerHTML='<i class="pinMini" style="background:'+(p.type==='Construction'?'#1769df':'#ff7a00')+'"></i><div class="itemMain"><div class="name">'+esc(p.client)+'</div><div class="meta">'+esc(p.area)+'<br>'+esc(p.contractor)+'</div></div><span class="tag '+(p.type==='Construction'?'c':'f')+'">'+p.type+'</span><span class="arrow">›</span>';el.onclick=()=>{detail(p);if(Number.isFinite(p.lat)&&Number.isFinite(p.lon))map.setView([p.lat,p.lon],16)};list.appendChild(el)});viewAll.textContent='View All Projects ('+ps.length+')  ›'}search.oninput=type.onchange=area.onchange=render;reset.onclick=()=>{search.value='';type.value='';area.value='';render()};clear.onclick=()=>{search.value='';type.value='';area.value='';details.style.display='none';render()};viewAll.onclick=()=>{search.value='';type.value='';area.value='';render()};close.onclick=()=>details.style.display='none';total.textContent=P.length;const c=P.filter(p=>p.type==='Construction').length,f=P.filter(p=>p.type==='Finishing').length;construction.textContent=c;finishing.textContent=f;lc.textContent=c;lf.textContent=f;render()}catch(e){console.error(e);document.getElementById('list').innerHTML='<div style="padding:20px">Unable to load project data.</div>'}})();</script></body></html>
