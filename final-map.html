<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BADRIA KAFOOD ARCHITECTURE | Qatar Projects</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f4f7f9;color:#17232d}header{height:82px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:8px 14px}.brand{display:flex;align-items:center;gap:12px}.logo{width:62px;height:62px;object-fit:contain}.h1{font-size:20px;font-weight:800;color:#102536}.sub{font-size:11px;color:#71808c;margin-top:3px}.stats{display:flex;gap:7px}.stat{min-width:92px;text-align:center;border:1px solid #dfe7ec;border-radius:9px;padding:6px 9px}.stat b{display:block;font-size:19px;color:#087e91}.stat span{font-size:9px;font-weight:bold;color:#71808c}.bar{background:#fff;padding:8px;display:flex;gap:7px;border-bottom:1px solid #ddd}input,select,button{padding:9px;border:1px solid #d3dfe5;border-radius:8px;background:#fff}input{flex:1}.layout{display:grid;grid-template-columns:1fr 380px;height:calc(100vh - 125px)}#map{min-height:0}.panel{background:#fff;border-left:1px solid #ddd;overflow:auto;padding:10px}.project{border:1px solid #dfe7ec;border-radius:10px;padding:10px;margin-bottom:7px;cursor:pointer}.row{display:flex;justify-content:space-between;gap:5px}.name{font-weight:bold;font-size:13px}.badge{font-size:9px;padding:4px 7px;border-radius:15px;background:#e7f7fa;color:#087e91}.fin{background:#f5efe4;color:#8b621e}.meta{font-size:10px;color:#71808c;line-height:1.5;margin-top:5px}.open{display:block;margin-top:6px;color:#087e91;font-size:10px;font-weight:bold}@media(max-width:800px){header{height:65px;padding:6px 9px}.logo{width:48px;height:48px}.h1{font-size:14px}.sub{font-size:8px}.stats{display:none}.bar{display:grid;grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}.layout{display:flex;flex-direction:column;height:auto}#map{height:52vh;min-height:380px}.panel{border:0;border-top:1px solid #ddd}}</style></head><body><header><div class="brand"><img class="logo" src="logo.webp"><div><div class="h1">BADRIA KAFOOD ARCHITECTURE</div><div class="sub">Qatar Active Projects — Location Dashboard</div></div></div><div class="stats"><div class="stat"><b id="total">46</b><span>TOTAL PROJECTS</span></div><div class="stat"><b id="construction">17</b><span>CONSTRUCTION</span></div><div class="stat"><b id="finishing">29</b><span>FINISHING</span></div></div></header><div class="bar"><input id="search" placeholder="Search client, contractor, supervisor, MEP or area"><select id="type"><option value="">All project types</option><option>Construction</option><option>Finishing</option></select><button id="qatar">Qatar</button></div><div class="layout"><div id="map"></div><aside class="panel"><h3>Project Directory <span id="shown"></span></h3><div id="list"></div></aside></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(async()=>{try{const s=await fetch('https://raw.githubusercontent.com/MrBBlackk/badria-kafood-projects/080717cf8cbd5f8bd464f9598fd810dfaa4d6f36/index.html').then(r=>r.text()),m=s.match(/const P=(.*?); const map=/s);if(!m)throw 0;const P=JSON.parse(m[1]),x={"https://maps.app.goo.gl/WpDwP8ZBzWh8eUKd8":[25.441819,51.517491],"https://maps.app.goo.gl/BtndLTyvJUXmToUG8":[25.4470539,51.504791],"https://maps.app.goo.gl/4VNAxv5K9pR4DFw38":[25.4457033,51.503054],"https://maps.app.goo.gl/u7zQXZc4DTPhAgn37":[25.4474453,51.4993173],"https://maps.app.goo.gl/iDojbxr14yaYa96PA":[25.4471801,51.5020914]};P.forEach(p=>{if(x[p.map])[p.lat,p.lon]=x[p.map]});const map=L.map('map').setView([25.285,51.53],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);function render(){layer.clearLayers();list.innerHTML='';const q=search.value.toLowerCase().trim(),t=type.value,ps=P.filter(p=>(!q||[p.id,p.client,p.contractor,p.supervisor,p.area,p.mep].join(' ').toLowerCase().includes(q))&&(!t||p.type===t));shown.textContent='('+ps.length+')';const pts=[];ps.forEach(p=>{if(!Number.isFinite(p.lat)||!Number.isFinite(p.lon))return;const mk=L.marker([p.lat,p.lon]).bindPopup('<b>'+esc(p.client)+'</b><br>Project #'+p.id+'<br>'+esc(p.type)+'<br>'+esc(p.area)+'<br><b>Contractor:</b> '+esc(p.contractor)+'<br><b>Supervisor:</b> '+esc(p.supervisor)+(p.map?'<br><a target="_blank" href="'+esc(p.map)+'">Open exact Google Maps location →</a>':''));layer.addLayer(mk);pts.push([p.lat,p.lon]);const d=document.createElement('div');d.className='project';d.innerHTML='<div class="row"><div class="name">#'+p.id+' — '+esc(p.client)+'</div><span class="badge '+(p.type==='Finishing'?'fin':'')+'">'+esc(p.type)+'</span></div><div class="meta"><b>Area:</b> '+esc(p.area)+'<br><b>Contractor:</b> '+esc(p.contractor)+'<br><b>Supervisor:</b> '+esc(p.supervisor)+'<br><b>MEP:</b> '+esc(p.mep)+'</div>'+(p.map?'<a class="open" target="_blank" href="'+esc(p.map)+'">Exact Google Maps location →</a>':'');d.onclick=()=>{map.setView([p.lat,p.lon],15);mk.openPopup()};list.appendChild(d)});if(pts.length)map.fitBounds(pts,{padding:[20,20],maxZoom:13})}search.oninput=type.onchange=render;qatar.onclick=()=>map.setView([25.285,51.53],10);render()}catch(e){document.body.innerHTML='<h2 style="padding:30px">Unable to load project data.</h2>'}})();</script></body></html>
