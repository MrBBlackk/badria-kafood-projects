<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Badria Kafood Architecture | Project Map</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6f8;color:#17232d}.top{background:#102536;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:19px;font-weight:800}.sub{font-size:11px;opacity:.7;margin-top:3px}.legend{font-size:12px}.legend span{margin-left:15px}.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px}.c{background:#1677d2}.f{background:#f28c28}.stats{display:flex;gap:10px;background:#fff;padding:11px 15px;border-bottom:1px solid #dfe7ec}.stat{border:1px solid #e0e7eb;border-radius:9px;padding:8px 14px;min-width:100px}.stat b{display:block;font-size:20px}.stat small{color:#71808c}.bar{background:#fff;padding:9px 15px;display:flex;gap:8px;border-bottom:1px solid #dfe7ec}.bar input,.bar select{padding:9px;border:1px solid #ccd8df;border-radius:8px}.bar input{flex:1}.layout{display:grid;grid-template-columns:1fr 370px;height:calc(100vh - 151px)}#map{height:100%}.side{background:#fff;border-left:1px solid #dfe7ec;overflow:auto;padding:11px}.item{border:1px solid #e0e7eb;border-radius:9px;padding:9px;margin-bottom:7px;cursor:pointer}.name{font-weight:700;font-size:13px}.badge{float:right;color:#fff;border-radius:12px;padding:3px 7px;font-size:9px}.meta{font-size:10px;color:#71808c;line-height:1.5;margin-top:4px}.pin{width:25px;height:25px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 7px #0005}.pin i{display:block;width:7px;height:7px;background:#fff;border-radius:50%;margin:6px}.blue{background:#1677d2}.orange{background:#f28c28}@media(max-width:800px){.layout{display:flex;flex-direction:column;height:auto}#map{height:55vh;min-height:390px}.side{border:0;border-top:1px solid #dfe7ec}.top{padding:11px}.stats{display:none}.bar{display:grid;grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}}
</style></head><body><header class="top"><div><div class="brand">BADRIA KAFOOD ARCHITECTURE</div><div class="sub">Qatar Active Projects — Project Location Dashboard</div></div><div class="legend"><span><i class="dot c"></i>Construction</span><span><i class="dot f"></i>Finishing</span></div></header><div class="stats"><div class="stat"><b id="total">0</b><small>Total</small></div><div class="stat"><b id="cc">0</b><small>Construction</small></div><div class="stat"><b id="ff">0</b><small>Finishing</small></div></div><div class="bar"><input id="q" placeholder="Search client, contractor, engineer or area"><select id="t"><option value="">All project types</option><option>Construction</option><option>Finishing</option></select></div><main class="layout"><div id="map"></div><aside class="side"><div id="list"></div></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(async()=>{const updated={"https://maps.app.goo.gl/WpDwP8ZBzWh8eUKd8":[25.441819,51.517491],"https://maps.app.goo.gl/BtndLTyvJUXmToUG8":[25.4470539,51.504791],"https://maps.app.goo.gl/4VNAxv5K9pR4DFw38":[25.4457033,51.503054],"https://maps.app.goo.gl/u7zQXZc4DTPhAgn37":[25.4474453,51.4993173],"https://maps.app.goo.gl/iDojbxr14yaYa96PA":[25.4471801,51.5020914]};const txt=await fetch('index.html').then(r=>r.text()),m=txt.match(/const P=(.*?); const map=/s);if(!m)throw Error('Project data not found');const P=JSON.parse(m[1]);P.forEach(p=>{if(updated[p.map]){p.lat=updated[p.map][0];p.lon=updated[p.map][1]}});const map=L.map('map').setView([25.285,51.53],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const layer=L.layerGroup().addTo(map),esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function icon(p){return L.divIcon({className:'',html:'<div class="pin '+(p.type==='Construction'?'blue':'orange')+'"><i></i></div>',iconSize:[25,25],iconAnchor:[12,24],popupAnchor:[0,-21]})}function render(){layer.clearLayers();list.innerHTML='';const s=q.value.toLowerCase().trim(),ty=t.value,ps=P.filter(p=>(!ty||p.type===ty)&&(!s||[p.client,p.contractor,p.supervisor,p.area,p.mep].join(' ').toLowerCase().includes(s)));total.textContent=ps.length;cc.textContent=ps.filter(p=>p.type==='Construction').length;ff.textContent=ps.filter(p=>p.type==='Finishing').length;const b=[];ps.forEach(p=>{const has=Number.isFinite(p.lat)&&Number.isFinite(p.lon);let mk;if(has){mk=L.marker([p.lat,p.lon],{icon:icon(p)}).bindPopup('<b>'+esc(p.client)+'</b><br>'+esc(p.type)+'<br>'+esc(p.area)+'<br><b>Contractor:</b> '+esc(p.contractor)+'<br><b>Supervisor:</b> '+esc(p.supervisor)+(p.map?'<br><a href="'+esc(p.map)+'" target="_blank">Open exact Google Maps location →</a>':'')).addTo(layer);b.push([p.lat,p.lon])}const d=document.createElement('div');d.className='item';d.innerHTML='<span class="badge '+(p.type==='Construction'?'c':'f')+'">'+p.type+'</span><div class="name">#'+p.id+' — '+esc(p.client)+'</div><div class="meta">'+esc(p.area)+' · '+esc(p.contractor)+'<br>'+esc(p.supervisor)+' · '+esc(p.mep)+'</div>';d.onclick=()=>{if(has){map.setView([p.lat,p.lon],16);mk.openPopup()}else if(p.map)window.open(p.map,'_blank')};list.appendChild(d)});if(b.length)map.fitBounds(b,{padding:[30,30],maxZoom:14})}q.oninput=t.onchange=render;render()})().catch(e=>document.body.innerHTML='<h2 style="padding:30px">Unable to load project data.</h2>');</script></body></html>
